syntax = "proto3";

package com.example.signal.v1;

option java_multiple_files = true;
option java_package = "com.example.signal.v1";
option java_outer_classname = "SignalServiceProto";

// Signal models
message SignalRequest {
  string signal_id = 1;
  string source = 2;
  string payload = 3;
  int64 timestamp = 4;
  string signal_type = 5;
}

message SignalResponse {
  string signal_id = 1;
  bool success = 2;
  string message = 3;
  int64 processed_at = 4;
  string status_code = 5;
}

message HealthCheckRequest {
  string client_name = 1;
}

message HealthCheckResponse {
  string status = 1;
  int64 uptime_seconds = 2;
  string server_time = 3;
}

message TelemetryRequest {
  string metrics_json = 1;
}

message TelemetryResponse {
  int32 items_accepted = 1;
}

// Bi-directional Event-Driven Streaming models
message EventMessage {
  string event_id = 1;
  string event_type = 2;
  string payload = 3;
  int64 timestamp = 4;
  int64 sequence_number = 5;
}

message EventResponse {
  string event_id = 1;
  string status = 2; // e.g. "ACK", "PROCESSED", "REJECTED"
  string message = 3;
  int64 processed_at = 4;
  int64 sequence_number = 5;
}

// SignalService definition
service SignalService {
  rpc SendSignal (SignalRequest) returns (SignalResponse);
  rpc GetHealth (HealthCheckRequest) returns (HealthCheckResponse);
  rpc SubmitTelemetry (TelemetryRequest) returns (TelemetryResponse);

  // Bi-directional event-driven streaming RPC (Client to Server & Server to Client)
  rpc EventChannel (stream EventMessage) returns (stream EventResponse);
}
